name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No repository secrets are used anywhere in this workflow, on purpose.
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - run: python3 scripts/check_secrets.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 #v6.0.8
        with:
          run_install: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f #v6.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec next build

  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 #v6.0.8
        with:
          run_install: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f #v6.1.0
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 #master
        with:
          toolchain: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 #v2.9.1
        with:
          workspaces: src-tauri
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tauri icon assets/logo.png
      - run: |
          mkdir -p dist src-tauri/binaries
          echo '<!doctype html>' > dist/index.html
          touch src-tauri/binaries/chihua-proxy-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/chihua-proxy-x86_64-unknown-linux-gnu
      - working-directory: src-tauri
        run: cargo check --all-targets --message-format=short

  windows:
    needs: [secrets, frontend, backend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 #v6.0.8
        with:
          run_install: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f #v6.1.0
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 #master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 #v2.9.1
        with:
          workspaces: src-tauri
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tauri icon assets/logo.png
      - run: pnpm exec next build
      - shell: bash
        working-directory: src-tauri
        run: |
          mkdir -p binaries
          touch binaries/chihua-proxy-x86_64-pc-windows-msvc.exe
          cargo build --bin chihua-proxy --target x86_64-pc-windows-msvc --release
          cp target/x86_64-pc-windows-msvc/release/chihua-proxy.exe binaries/chihua-proxy-x86_64-pc-windows-msvc.exe
      - run: pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: chihua-browser-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
