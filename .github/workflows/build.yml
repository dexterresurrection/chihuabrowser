name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No repository secrets are used anywhere in this workflow, on purpose.
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - run: python3 scripts/check_secrets.py

  tunnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Xray for the real tests
        run: |
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip
          echo "e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214  xray.zip" | sha256sum -c
          unzip -q xray.zip xray -d "$RUNNER_TEMP"
      - working-directory: sidecar/tunnel
        env:
          GOFLAGS: -mod=mod
        run: |
          go vet ./...
          CHIHUA_TEST_XRAY="$RUNNER_TEMP/xray" go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 #v6.0.8
        with:
          run_install: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f #v6.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec next build

  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 #v6.0.8
        with:
          run_install: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f #v6.1.0
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 #master
        with:
          toolchain: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 #v2.9.1
        with:
          workspaces: src-tauri
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tauri icon assets/icon.png
      - run: |
          mkdir -p dist src-tauri/binaries
          echo '<!doctype html>' > dist/index.html
          for b in chihua-proxy chihua-tunnel xray; do
            touch src-tauri/binaries/$b-x86_64-unknown-linux-gnu
            chmod +x src-tauri/binaries/$b-x86_64-unknown-linux-gnu
          done
      - working-directory: src-tauri
        run: cargo check --all-targets --message-format=short

  windows:
    needs: [secrets, tunnel, frontend, backend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 #v6.0.8
        with:
          run_install: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f #v6.1.0
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 #master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 #v2.9.1
        with:
          workspaces: src-tauri
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tauri icon assets/icon.png
      - run: pnpm exec next build
      - name: Tunnel program and xray
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          (cd sidecar/tunnel && GOFLAGS=-mod=mod go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../../src-tauri/binaries/chihua-tunnel-x86_64-pc-windows-msvc.exe ./cmd/chihua-tunnel)
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-windows-64.zip
          echo "2e04a9995a6f2ad1b28c0bb25c708ecb2695e43a1c9c7889c4b6ac2b48cf7a6a  xray.zip" | sha256sum -c
          unzip -q -o xray.zip xray.exe -d xray-out
          cp xray-out/xray.exe src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe
          # Блокировщик и VPN Cloud VPN — в каждом профиле: расширение с нашего сайта, публичный файл
          mkdir -p src-tauri/resources/cloudvpn-ext
          curl -fsSL -o ext.zip https://cabinet.zjd.uk/app/CloudVPN-Chrome.zip
          unzip -q -o ext.zip -d src-tauri/resources/cloudvpn-ext
          test -f src-tauri/resources/cloudvpn-ext/manifest.json
      - name: zapret (обход блокировок без VPN)
        shell: bash
        run: |
          # winws из релиза bol-van/zapret и стратегии Flowseal, архивы закреплены по SHA-256 (zapret/bundle.py)
          (cd zapret/zapretctl && go build -trimpath -ldflags "-s -w" -o ../../zapretctl.exe .)
          python zapret/bundle.py --out src-tauri/resources/zapret --zapretctl zapretctl.exe
          test -f src-tauri/resources/zapret/bin/winws.exe
          test -f src-tauri/resources/zapret/zapretctl.exe
      - shell: bash
        working-directory: src-tauri
        run: |
          mkdir -p binaries
          touch binaries/chihua-proxy-x86_64-pc-windows-msvc.exe
          cargo build --bin chihua-proxy --target x86_64-pc-windows-msvc --release
          cp target/x86_64-pc-windows-msvc/release/chihua-proxy.exe binaries/chihua-proxy-x86_64-pc-windows-msvc.exe
      - run: pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: chihua-browser-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  windows-smoke:
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: actions/download-artifact@v4
        with:
          name: chihua-browser-windows-x64
          path: installer
      - name: Install silently and start the app
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer -Filter *.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter 'chihuabrowser.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Include 'Chihua*.exe' -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'uninstall|proxy|tunnel' } | Select-Object -First 1 }
          if (-not $exe) { throw 'installed app not found' }
          "installed: $($exe.FullName)"
          Get-ChildItem $exe.DirectoryName | Select-Object Name,Length | Format-Table | Out-String
          foreach ($side in 'chihua-proxy.exe','chihua-tunnel.exe','xray.exe') {
            if (-not (Test-Path (Join-Path $exe.DirectoryName $side))) { throw "$side is not next to the app" }
          }
          & (Join-Path $exe.DirectoryName 'xray.exe') version | Select-Object -First 1
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep 25
          if ($p.HasExited) { throw "app exited with code $($p.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width,$b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
          $bmp.Save("$PWD\screen.png")
          Stop-Process -Id $p.Id -Force
      - name: Engine applies its switches on Windows
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'chihua-ci' } https://api.github.com/repos/adryfish/fingerprint-chromium/releases/latest
          $asset = $release.assets | Where-Object { $_.name -like '*_windows_x64.zip' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile engine.zip
          Expand-Archive engine.zip engine
          $chrome = Get-ChildItem engine -Recurse -Filter chrome.exe | Select-Object -First 1
          "engine: $($chrome.FullName)"
          Set-Content page.html '<script>document.title=navigator.hardwareConcurrency+"|"+navigator.platform+"|"+navigator.userAgent</script><body><script>document.body.innerText=document.title</script>'
          $page = (Resolve-Path page.html).Path
          $url = 'file:///' + ($page -replace '\\','/')
          $args = @('--headless=new','--no-sandbox','--fingerprint=12345','--fingerprint-platform=linux','--fingerprint-hardware-concurrency=7',"--user-data-dir=$PWD\data",'--virtual-time-budget=4000','--dump-dom',$url)
          $p = Start-Process $chrome.FullName -ArgumentList $args -RedirectStandardOutput out.txt -RedirectStandardError err.txt -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'engine did not finish' }
          $text = Get-Content out.txt -Raw
          "output: $text"
          if ($text -notmatch '7\|Linux') { Get-Content err.txt -Tail 20; throw 'the switches had no effect' }
      - name: zapret switches on and off on a real Windows
        shell: pwsh
        continue-on-error: true
        run: |
          $ctl = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter 'zapretctl.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ctl) { throw 'zapretctl.exe is not installed next to the app' }
          Write-Host "zapretctl: $($ctl.FullName)"
          function Ctl([string[]]$a) {
            $out = (& $ctl.FullName @a | Out-String).Trim()
            Write-Host "zapretctl $($a -join ' ') -> $out"
            return ($out.Split("`n")[-1] | ConvertFrom-Json)
          }
          try {
            $s = Ctl @('status')
            if (-not $s.status.supported) { throw 'status: not supported' }
            if ($s.status.presets.Count -lt 20) { throw 'presets are missing' }
            $r = Ctl @('start', '--preset', 'general')
            if (-not $r.ok) { throw "start failed: $($r.error)" }
            Start-Sleep 3
            $s = Ctl @('status')
            if (-not $s.status.running) { throw 'not running after start' }
            Get-CimInstance Win32_Service -Filter "Name='CloudVPNZapret'" | Format-List Name,State,StartMode,PathName | Out-String | Write-Host
            Get-Process winws | Select-Object Id,Path | Format-Table | Out-String | Write-Host
            try { Write-Host "generate_204 through zapret: $((Invoke-WebRequest https://www.google.com/generate_204 -UseBasicParsing -TimeoutSec 20).StatusCode)" } catch { Write-Host "web: $_" }
            $r = Ctl @('start', '--preset', 'general (ALT)')
            if (-not $r.ok) { throw "switching the strategy failed: $($r.error)" }
            if (-not $r.status.running -or $r.status.preset -ne 'general (ALT)') { throw 'the new strategy is not running' }
            $sddl = (Get-Acl "$env:ProgramData\CloudVPN\zapret").Sddl
            Write-Host "acl: $sddl"
            if (-not $sddl.StartsWith('O:BA')) { throw 'the shared folder is not owned by Administrators' }
          } finally {
            $r = Ctl @('stop')
            $s = Ctl @('status')
            Get-Content "$env:ProgramData\CloudVPN\zapret\zapretctl.log" -ErrorAction SilentlyContinue | Write-Host
          }
          if (-not $r.ok) { throw "stop failed: $($r.error)" }
          if ($s.status.installed -or $s.status.running) { throw 'the service is still there after stop' }
          if (Get-Process winws -ErrorAction SilentlyContinue) { throw 'winws is still running after stop' }
          Write-Host 'zapret: on, strategy switch, off - all good'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screen
          path: screen.png
          if-no-files-found: warn
          retention-days: 14
